[package]
name = "yaagl-squircle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/LuMiSxh/yaagl-squircle"

[features]
default = ["cmd-update"]
cmd-update = ["dep:ureq", "dep:flate2", "dep:tar"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
flate2 = "1"
tar = { version = "0.4", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
